<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Borya · Sheets{% endblock %}</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:#18342b;font:16px/1.55 system-ui,sans-serif}header{background:#173e32;color:white;padding:1rem max(1rem,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:1rem}header a{color:white}main{max-width:1100px;margin:2rem auto;padding:0 1rem}a{color:#19694f}h1{font-size:2rem;margin-bottom:.25rem}h2{font-size:1.2rem}h3{font-size:1rem;margin-bottom:.25rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:1rem}.card{background:white;border:1px solid #d6e1da;border-radius:12px;padding:1.2rem;margin-bottom:1rem;overflow:auto}.muted{color:#586c64}.warning{border-left:4px solid #a56818;padding:.75rem;background:#fff5df}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.5rem;border-bottom:1px solid #e4ece7}button{padding:.5rem 1rem;border:1px solid #7c998e;border-radius:6px;background:white;color:#173e32;cursor:pointer}input{padding:.6rem;max-width:100%}.prose{white-space:pre-wrap}header form{margin:0}dt{font-weight:600}dd{margin:0 0 .7rem}small{font-size:.85rem}
</style>
</head>
<body>
<header>
<a href="{% url 'sheets:list' %}">Borya / Sheets</a>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button>
</form>{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
